project_id = "matlogg"

[api]
enabled = true
port = 55321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55322
shadow_port = 55320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 55323

[local_smtp]
enabled = true
port = 55324
smtp_port = 55325
pop3_port = 55326

[analytics]
enabled = true
port = 55327
backend = "postgres"

[auth]
enabled = true
site_url = "matlogg://auth/callback"
additional_redirect_urls = ["matlogg://auth/callback"]
jwt_expiry = 900
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
min_password_length = 8

[auth.external.apple]
enabled = true
client_id = "com.nithusan.MatLogg"
secret = "env(SUPABASE_AUTH_EXTERNAL_APPLE_SECRET)"

[functions.sync-events]
verify_jwt = true

[functions.delete-account]
verify_jwt = true

[functions.purge-accounts]
verify_jwt = false
