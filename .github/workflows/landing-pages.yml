name: Publish MatLogg landing page

on:
  push:
    branches: [main]
    paths:
      - 'matlogg-web/**'
      - '.github/workflows/landing-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: landing-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: matlogg-web/package-lock.json
      - uses: actions/configure-pages@v5
      - run: npm ci
        working-directory: matlogg-web
      - run: npm run build
        working-directory: matlogg-web
      - uses: actions/upload-pages-artifact@v4
        with:
          path: matlogg-web/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish static prototype
        id: deployment
        uses: actions/deploy-pages@v4
